name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check & Build
        run: |
          npm run check
          npm run build

      - name: Deploy to Render (if webhook secret exists)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify Health Check (optional if APP_URL is configured)
        if: env.APP_URL != ''
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Verifying $APP_URL/health..."
          curl --retry 5 --retry-connrefused "$APP_URL/health"
