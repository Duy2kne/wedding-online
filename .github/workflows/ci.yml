name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build verification
        run: npm run check

      - name: Build client and server
        run: npm run build

      - name: Start server in background and verify /health
        run: |
          node server.js &
          SERVER_PID=$!
          curl --retry 10 --retry-connrefused --retry-delay 2 http://localhost:3000/health
          kill $SERVER_PID
