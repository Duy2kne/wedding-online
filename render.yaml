services:
  - type: web
    name: tiec-cuoi-duy-tam
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MAX_PER_HALL
        value: 50
      - key: MAX_HALLS
        value: 6
      # Đặt mật khẩu trong Render > Environment (không ghi vào file để khỏi lộ trên GitHub)
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: ./data
