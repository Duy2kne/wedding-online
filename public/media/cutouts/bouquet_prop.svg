<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Wedding Flower Bouquet Prop -->
  <defs>
    <filter id="bqtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#bqtShadow)" transform="translate(120, 120)">
    <!-- Stems & Ribbon -->
    <path d="M -15 20 L -8 80 L 8 80 L 15 20 Z" fill="#15803d"/>
    <!-- Satin Ribbon Wrap -->
    <rect x="-12" y="35" width="24" height="28" rx="4" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <!-- Ribbon Bow -->
    <path d="M -30 45 Q -10 40 0 50 Q -10 60 -30 55 Z" fill="#f472b6"/>
    <path d="M 30 45 Q 10 40 0 50 Q 10 60 30 55 Z" fill="#f472b6"/>
    <circle cx="0" cy="50" r="5" fill="#db2777"/>
    <path d="M -5 55 L -18 85 L -8 85 L 0 60 Z" fill="#f472b6"/>
    <path d="M 5 55 L 18 85 L 8 85 L 0 60 Z" fill="#f472b6"/>

    <!-- Lush Roses & Flowers Dome -->
    <!-- Green Leaves -->
    <ellipse cx="-45" cy="-10" rx="18" ry="12" fill="#16a34a" transform="rotate(-30, -45, -10)"/>
    <ellipse cx="45" cy="-10" rx="18" ry="12" fill="#16a34a" transform="rotate(30, 45, -10)"/>
    <ellipse cx="0" cy="-60" rx="18" ry="12" fill="#22c55e"/>

    <!-- Pink Rose Center -->
    <circle cx="0" cy="-15" r="28" fill="#f43f5e"/>
    <circle cx="0" cy="-15" r="20" fill="#fb7185"/>
    <circle cx="0" cy="-15" r="12" fill="#fda4af"/>
    <circle cx="0" cy="-15" r="6" fill="#fff1f2"/>

    <!-- White & Blush Roses Around -->
    <circle cx="-32" cy="-30" r="22" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <circle cx="-32" cy="-30" r="12" fill="#fce7f3"/>
    <circle cx="32" cy="-30" r="22" fill="#fbcfe8"/>
    <circle cx="32" cy="-30" r="12" fill="#f472b6"/>

    <circle cx="-25" cy="5" r="20" fill="#fda4af"/>
    <circle cx="25" cy="5" r="20" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <circle cx="0" cy="-45" r="18" fill="#fef08a"/>
    <circle cx="0" cy="-45" r="8" fill="#fde047"/>
  </g>
</svg>
