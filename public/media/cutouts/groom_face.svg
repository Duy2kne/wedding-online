<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Groom (Hoàng Duy) Stylized Face Cutout -->
  <defs>
    <radialGradient id="groomSkin" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="80%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Groom Neck & Collar -->
    <path d="M 120 230 L 120 270 L 180 270 L 180 230 Z" fill="#fed7aa"/>
    <path d="M 110 260 L 150 285 L 125 315 L 85 285 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 190 260 L 150 285 L 175 315 L 215 285 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Groom Black Bow Tie -->
    <path d="M 130 280 L 150 290 L 130 300 Z" fill="#1e293b"/>
    <path d="M 170 280 L 150 290 L 170 300 Z" fill="#1e293b"/>
    <circle cx="150" cy="290" r="7" fill="#0f172a"/>

    <!-- Groom Face Oval -->
    <ellipse cx="150" cy="165" rx="65" ry="75" fill="url(#groomSkin)"/>

    <!-- Ears -->
    <circle cx="82" cy="165" r="14" fill="#fdba74"/>
    <circle cx="218" cy="165" r="14" fill="#fdba74"/>

    <!-- Groom Hairstyle: Sleek Modern Wedding Quiff -->
    <path d="M 80 145 C 80 80, 110 50, 150 45 C 190 40, 225 75, 220 145 C 215 130, 205 105, 185 95 C 160 85, 120 90, 85 135 Z" fill="#1c1917"/>
    <path d="M 135 48 C 170 42, 215 65, 220 120 C 200 95, 160 85, 135 88 Z" fill="#292524"/>

    <!-- Eyebrows -->
    <path d="M 105 135 Q 125 128 140 135" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 160 135 Q 175 128 195 135" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Bright gentle wedding smile) -->
    <ellipse cx="122" cy="155" rx="8" ry="7" fill="#1c1917"/>
    <circle cx="125" cy="153" r="2.5" fill="#ffffff"/>
    <ellipse cx="178" cy="155" rx="8" ry="7" fill="#1c1917"/>
    <circle cx="181" cy="153" r="2.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 150 155 L 147 178 Q 153 182 155 178" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Gentle Wedding Smile -->
    <path d="M 132 195 Q 150 215 168 195" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round" fill="#ffffff"/>

    <!-- Subtle Rosy Cheek Blush -->
    <ellipse cx="106" cy="178" rx="12" ry="7" fill="#f43f5e" opacity="0.25"/>
    <ellipse cx="194" cy="178" rx="12" ry="7" fill="#f43f5e" opacity="0.25"/>
  </g>

  <!-- Tag Label -->
  <rect x="75" y="325" width="150" height="26" rx="13" fill="#1e293b" opacity="0.9"/>
  <text x="150" y="342" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fef08a">Chú Rể Hoàng Duy</text>
</svg>
