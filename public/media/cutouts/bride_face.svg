<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Bride (Thiều Tâm) Stylized Face Cutout -->
  <defs>
    <radialGradient id="brideSkin" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="75%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </radialGradient>
    <linearGradient id="veilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softGlowBride" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softGlowBride)">
    <!-- Bridal Sheer Veil in Background -->
    <path d="M 60 70 Q 150 20 240 70 Q 270 200 250 320 Q 150 350 50 320 Q 30 200 60 70 Z" fill="url(#veilGrad)"/>

    <!-- Slender Neck & Lace Wedding Gown Collar -->
    <path d="M 125 220 L 125 260 L 175 260 L 175 220 Z" fill="#fbcfe8"/>
    <!-- Pearl Necklace -->
    <path d="M 125 240 Q 150 255 175 240" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="248" r="4.5" fill="#fef08a"/>
    <!-- Off-shoulder lace dress -->
    <path d="M 85 270 Q 150 295 215 270 L 225 315 L 75 315 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>

    <!-- Flowing Soft Dark Hair (Behind Face) -->
    <path d="M 75 120 C 65 200 70 280 85 300 C 100 240 100 180 90 130 Z" fill="#262626"/>
    <path d="M 225 120 C 235 200 230 280 215 300 C 200 240 200 180 210 130 Z" fill="#262626"/>

    <!-- Bride Face Oval -->
    <ellipse cx="150" cy="160" rx="60" ry="70" fill="url(#brideSkin)"/>

    <!-- Ears & Pearl Earrings -->
    <circle cx="88" cy="160" r="11" fill="#fbcfe8"/>
    <circle cx="88" cy="172" r="3.5" fill="#fef08a"/>
    <circle cx="212" cy="160" r="11" fill="#fbcfe8"/>
    <circle cx="212" cy="172" r="3.5" fill="#fef08a"/>

    <!-- Bride Hairstyle: Elegant Wedding Updo with soft bangs -->
    <path d="M 85 135 C 80 85 110 50 150 48 C 190 50 220 85 215 135 C 205 110 180 95 150 95 C 120 95 95 110 85 135 Z" fill="#171717"/>
    <!-- Side bangs -->
    <path d="M 85 130 Q 100 150 105 170" stroke="#171717" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 215 130 Q 200 150 195 170" stroke="#171717" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Diamond Tiara / Floral Bridal Crown -->
    <path d="M 115 56 L 125 40 L 135 52 L 150 30 L 165 52 L 175 40 L 185 56 Z" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="150" cy="30" r="3.5" fill="#38bdf8"/>
    <circle cx="125" cy="40" r="2.5" fill="#f43f5e"/>
    <circle cx="175" cy="40" r="2.5" fill="#f43f5e"/>

    <!-- Delicate Curved Eyebrows -->
    <path d="M 108 132 Q 125 125 138 132" stroke="#262626" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 162 132 Q 175 125 192 132" stroke="#262626" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Sparkling Wedding Eyes with Eyelashes -->
    <ellipse cx="124" cy="148" rx="8" ry="7" fill="#171717"/>
    <circle cx="126" cy="146" r="3" fill="#ffffff"/>
    <circle cx="122" cy="151" r="1.5" fill="#ffffff"/>
    <path d="M 116 142 Q 124 138 133 144" stroke="#171717" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <ellipse cx="176" cy="148" rx="8" ry="7" fill="#171717"/>
    <circle cx="178" cy="146" r="3" fill="#ffffff"/>
    <circle cx="174" cy="151" r="1.5" fill="#ffffff"/>
    <path d="M 167 144 Q 176 138 184 142" stroke="#171717" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cute Nose -->
    <path d="M 150 152 L 148 170 Q 152 173 154 170" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Radiant Rosy Smile -->
    <path d="M 134 186 Q 150 205 166 186" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round" fill="#fda4af"/>

    <!-- Sweet Pink Cheeks -->
    <ellipse cx="110" cy="168" rx="14" ry="8" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="190" cy="168" rx="14" ry="8" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- Tag Label -->
  <rect x="75" y="325" width="150" height="26" rx="13" fill="#be185d" opacity="0.9"/>
  <text x="150" y="342" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Cô Dâu Thiều Tâm</text>
</svg>
